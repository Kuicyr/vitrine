name: Build Vitrine IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link do zdekryptowanego pliku Spotify .ipa'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/setup-theos@main

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot coreutils unzip zip
          pip3 install gdown uv --break-system-packages
          uv tool install 'cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw'

      - name: Download Spotify IPA
        run: |
          gdown "${{ github.event.inputs.ipa_url }}" -O app.ipa

      - name: Build Tweak and Inject
        run: |
          mkdir -p ipa
          mv app.ipa ipa/
          
          export PATH="$HOME/.local/bin:$PATH"
          
          make release

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-Spotify-iOS
          path: |
            packages/*.ipa
            out/*.ipa
            *.ipa
            !ipa/app.ipa
