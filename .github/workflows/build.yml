name: Build Vitrine IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link do zdekryptowanego pliku Spotify .ipa'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          brew install make ldid dpkg fakeroot xz coreutils zstd uv
          uv tool install 'cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw'

      - name: Setup Theos
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk $GITHUB_WORKSPACE/theos/sdks
          rm -r master.zip sdks-master

      - name: Download Spotify IPA
        run: |
          pip3 install gdown --break-system-packages
          gdown "${{ github.event.inputs.ipa_url }}" -O app.ipa

      - name: Build Tweak and Inject
        run: |
          # Przeniesienie czystego IPA do wymaganego folderu
          mkdir -p ipa
          mv app.ipa ipa/
          
          # Wymuszenie użycia GNU Make oraz dodanie narzędzia cyan do PATH
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$HOME/.local/bin:$PATH"
          
          # Właściwa kompilacja i wstrzyknięcie
          make release

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-Spotify-iOS
          path: |
            packages/*.ipa
            out/*.ipa
            *.ipa
            !ipa/app.ipa
