name: Build Vitrine IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link do zdekryptowanego pliku Spotify .ipa'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk $GITHUB_WORKSPACE/theos/sdks
          rm -r master.zip sdks-master

      - name: Download Spotify IPA
        run: |
          pip3 install gdown --break-system-packages
          gdown "${{ github.event.inputs.ipa_url }}" -O app.ipa

      - name: Build Tweak and Inject
        run: |
          make release

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-Spotify-iOS
          path: packages/*.ipa
