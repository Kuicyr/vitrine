name: Build Vitrine IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link do zdekryptowanego pliku Spotify .ipa'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          brew install make ldid dpkg xz coreutils zstd uv
          uv tool install 'cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw'

      - name: Setup Theos
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk $GITHUB_WORKSPACE/theos/sdks
          rm -r master.zip sdks-master

      - name: Setup Mock Fakeroot
        run: |
          mkdir -p $HOME/mock-bin
          cat << 'EOF' > $HOME/mock-bin/fakeroot
          #!/bin/bash
          # Pętla usuwająca flagi własne fakeroota (-i, -s, -f) i ich wartości
          while [[ $# -gt 0 && "$1" == -* ]]; do
              if [[ "$1" == "-i" || "$1" == "-s" || "$1" == "-f" ]]; then
                  shift 2
              else
                  shift 1
              fi
          done
          
          # Ignorowanie poleceń zmiany właściciela, by uniknąć błędów uprawnień
          if [[ "$1" == "chown" || "$1" == "chgrp" ]]; then
              exit 0
          fi
          
          # Wykonanie właściwego polecenia pakującego (np. dpkg-deb)
          exec "$@"
          EOF
          chmod +x $HOME/mock-bin/fakeroot

      - name: Download Spotify IPA
        run: |
          pip3 install gdown --break-system-packages
          gdown "${{ github.event.inputs.ipa_url }}" -O app.ipa

      - name: Build Tweak and Inject
        run: |
          mkdir -p ipa
          mv app.ipa ipa/
          
          # Dodanie naszego fakeroota na pierwsze miejsce w zmiennej PATH
          export PATH="$HOME/mock-bin:/opt/homebrew/opt/make/libexec/gnubin:$HOME/.local/bin:$PATH"
          
          # Właściwa kompilacja i pakowanie
          make release

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-Spotify-iOS
          path: |
            packages/*.ipa
            out/*.ipa
            *.ipa
            !ipa/app.ipa
